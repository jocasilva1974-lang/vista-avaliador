<!doctype html>
<html lang="pt-PT">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>Vista do Avaliador</title>

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>

<body>

  <main class="wrap">

    <header class="head">

      <h1>
        Vista do Avaliador
      </h1>

      <p class="muted">
        3 avaliações semanais, por 4 avaliadores,
        com resultados individuais, semanais e mensais.
      </p>

    </header>


    <!-- LOGIN -->

    <section
      id="login"
      class="card"
    >

      <h2>
        Entrar
      </h2>

      <input
        id="email"
        type="email"
        autocomplete="email"
        placeholder="E-mail"
      >

      <input
        id="password"
        type="password"
        autocomplete="current-password"
        placeholder="Password"
      >

      <p>
        <button
          id="signin"
          class="primary"
          type="button"
        >
          Entrar
        </button>
      </p>

      <p id="authMsg"></p>

    </section>


    <!-- APLICAÇÃO -->

    <section
      id="app"
      class="hidden"
    >

      <div class="row topbar">

        <span id="who"></span>

        <button
          id="logout"
          type="button"
        >
          Sair
        </button>

      </div>


      <!-- ABAS -->

      <nav
        class="tabs"
        aria-label="Áreas da aplicação"
      >

        <button
          id="tabEvaluate"
          class="tab active"
          type="button"
        >
          Avaliar
        </button>

        <button
          id="tabResults"
          class="tab"
          type="button"
        >
          📊 Resultados
        </button>

      </nav>


      <!-- AVALIAÇÃO -->

      <section id="evaluateView">

        <section class="card">

          <div
            id="counter"
            class="muted"
          ></div>

          <h2 id="person"></h2>


          <div class="form-grid">

            <label>

              Data da avaliação

              <input
                id="evaluationDate"
                type="date"
              >

            </label>


            <label>

              Avaliação da semana

              <select id="weeklySlot">

                <option value="1">
                  1.ª avaliação
                </option>

                <option value="2">
                  2.ª avaliação
                </option>

                <option value="3">
                  3.ª avaliação
                </option>

              </select>

            </label>

          </div>


          <div
            id="status"
            class="badge"
          ></div>

        </section>


        <!-- CRITÉRIOS -->

        <div id="criteria"></div>


        <!-- RESUMO DA AVALIAÇÃO -->

        <section
          id="liveSummary"
          class="card summary hidden"
        ></section>


        <!-- NAVEGAÇÃO -->

        <nav class="actions">

          <button
            id="prev"
            type="button"
          >
            Anterior
          </button>

          <button
            id="save"
            class="primary"
            type="button"
          >
            Guardar
          </button>

          <button
            id="next"
            type="button"
          >
            Seguinte
          </button>

        </nav>


        <p id="msg"></p>

      </section>


      <!-- RESULTADOS -->

      <section
        id="resultsView"
        class="hidden"
      >

        <section class="card">

          <h2>
            Resultados
          </h2>


          <div
            class="form-grid results-filters"
          >

            <label>

              Atleta

              <select
                id="resultPerson"
              ></select>

            </label>


            <label>

              Período

              <select id="resultPeriod">

                <option value="individual">
                  Avaliações individuais
                </option>

                <option value="week">
                  Semana
                </option>

                <option value="month">
                  Mês
                </option>

              </select>

            </label>


            <label id="weekField">

              Semana

              <input
                id="resultWeek"
                type="week"
              >

            </label>


            <label
              id="monthField"
              class="hidden"
            >

              Mês

              <input
                id="resultMonth"
                type="month"
              >

            </label>

          </div>


          <button
            id="loadResults"
            class="primary"
            type="button"
          >
            Calcular resultados
          </button>


          <p class="muted small">
            O resultado conjunto agrega as avaliações
            guardadas pelos 4 avaliadores com peso igual.
          </p>

        </section>


        <!-- SAÍDA DOS RESULTADOS -->

        <section
          id="resultsOutput"
          class="card"
        >

          <p class="muted">
            Escolhe o atleta e o período.
          </p>

        </section>


        <p id="resultsMsg"></p>

      </section>

    </section>

  </main>


  <!-- SUPABASE -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">\</script>


  <!-- CONFIGURAÇÃO -->

  <script src="config.js"></script>


  <!-- APLICAÇÃO -->

  <script src="app.js"></script>

</body>

</html>
